; Managed by aipanel. One tenant's PHP-FPM pool, inside its own container.
[www]
; The container already runs as the tenant's uid, so no user/group switch here.
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
