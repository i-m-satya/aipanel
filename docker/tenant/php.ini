; Managed by aipanel. Tenant PHP settings.
;
; A container is the real boundary here, so these are about limiting blast
; radius inside it rather than being the boundary themselves.
display_errors = Off
log_errors = On
expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 64M
post_max_size = 64M

; Writable state lives under /app/shared; everything else is read-only.
upload_tmp_dir = /app/shared/tmp
sys_temp_dir = /app/shared/tmp
session.save_path = /app/shared/sessions

; Shelling out has no legitimate use in a site aipanel deploys from git.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,proc_nice,pcntl_exec,dl

opcache.enable = 1
opcache.validate_timestamps = 0
