# Managed by aipanel. One tenant's own nginx, inside its own container.
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 64m;
    server_tokens off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;

    server {
        listen ${AIPANEL_LISTEN};
        server_name _;
        root ${AIPANEL_ROOT};
        index index.php index.html;

        # Never serve VCS metadata, env files or dependency sources.
        location ~ /\.(git|env|ssh) { deny all; return 404; }
        location ~ ^/(vendor|storage|node_modules)/ { deny all; return 404; }
        location ~ /\. { deny all; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            # The edge terminates TLS, so tell the application what the browser used.
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_read_timeout 60s;
            fastcgi_hide_header X-Powered-By;
        }
    }
}
