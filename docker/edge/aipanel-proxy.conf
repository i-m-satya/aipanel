# Managed by aipanel. Shared proxy settings for every tenant server block.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# A tenant must not be able to spoof these by sending them inbound.
proxy_set_header X-Forwarded-Server "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_buffering off;
# A tenant container that is down must not take the edge down with it.
proxy_next_upstream off;
