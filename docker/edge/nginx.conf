# Managed by aipanel. The edge: the one process that binds a host port.
#
# It owns no site configuration of its own — each tenant's server block is
# generated into conf.d/ by the node agent, so this file rarely changes.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    server_tokens off;

    # Tenant hostnames arrive in the Host header, so names can be long.
    server_names_hash_bucket_size 128;

    log_format aipanel '$remote_addr $host "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log aipanel;

    # An unknown Host reaches no tenant: a request for a hostname this panel
    # does not serve must not fall through to whichever site loaded first.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # A self-signed pair, generated at install time, so a TLS handshake to
        # an unknown name fails cleanly instead of borrowing a tenant's
        # certificate.
        ssl_certificate     /etc/letsencrypt/default/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/default/privkey.pem;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type "text/plain";
        }

        location / {
            return 404;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
